<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1c1917" flood-opacity="0.05" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1c1917" flood-opacity="0.03" />
    </filter>
  </defs>

  <!-- Warm Canvas Background -->
  <rect width="1000" height="640" fill="#FAF9F5" />

  <!-- Navbar -->
  <rect width="1000" height="56" fill="#FAF9F5" stroke="#e7e5e4" stroke-width="1" />
  <rect x="50" y="14" width="28" height="28" rx="7" fill="#1c1917" />
  <path d="M57 28 L64 21 L71 28 L64 35 Z" fill="#fcd34d" />
  <text x="88" y="33" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="-0.3" fill="#1c1917">CardForge</text>

  <!-- Nav links -->
  <text x="200" y="33" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1917">Dashboard</text>
  <line x1="200" y1="42" x2="265" y2="42" stroke="#1c1917" stroke-width="2" stroke-linecap="round" />
  <text x="290" y="33" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#78716c">My Decks</text>
  <text x="375" y="33" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#78716c">Explore</text>
  <text x="450" y="33" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#78716c">Review</text>
  <text x="525" y="33" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#78716c">Progress</text>

  <!-- Profile Chip -->
  <rect x="840" y="14" width="110" height="28" rx="8" fill="#f5f5f4" stroke="#e7e5e4" stroke-width="1" />
  <circle cx="856" cy="28" r="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
  <text x="853" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#92400e">A</text>
  <text x="872" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#44403c">Alex Chen</text>

  <!-- Welcoming Greeting Header -->
  <g transform="translate(70, 80)">
    <h1 font-family="'Plus Jakarta Sans', sans-serif">
      <text x="0" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.4" fill="#1c1917">Good morning, Alex</text>
    </h1>
    <text x="0" y="46" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="400" fill="#78716c">Ready for a quick study session?</text>
  </g>

  <!-- Primary Action Focal Point: Continue Learning Card -->
  <g transform="translate(70, 142)">
    <rect width="860" height="110" rx="16" fill="#ffffff" stroke="#e7e5e4" stroke-width="1" filter="url(#soft-shadow)" />

    <!-- Left Content -->
    <g transform="translate(24, 20)">
      <rect x="0" y="0" width="125" height="22" rx="6" fill="#fffbeb" stroke="#fef3c7" stroke-width="1" />
      <text x="8" y="15" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#92400e">✨ Ready to continue</text>

      <text x="0" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3" fill="#1c1917">
        Continue with JavaScript Fundamentals
      </text>

      <text x="0" y="66" font-family="'Inter', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#78716c">
        Revisit scope, closures, event loops, and lexical environment to lock them into memory.
      </text>
    </g>

    <!-- Right CTA Button -->
    <g transform="translate(680, 36)">
      <rect width="156" height="42" rx="10" fill="#1c1917" />
      <path d="M24 16 L32 21 L24 26 Z" fill="#fcd34d" />
      <text x="40" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff">Continue Learning</text>
    </g>
  </g>

  <!-- Your Learning Section (Clean honest numbers) -->
  <g transform="translate(70, 272)">
    <div font-family="'Plus Jakarta Sans', sans-serif">
      <text x="0" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="-0.2" fill="#1c1917">Your Learning</text>
      <text x="860" y="16" text-anchor="end" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#78716c">View full progress →</text>
    </div>

    <!-- 3 Stat Cards -->
    <g transform="translate(0, 26)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="273" height="74" rx="12" fill="#ffffff" stroke="#e7e5e4" stroke-width="1" filter="url(#soft-shadow)" />
      <text x="18" y="22" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#78716c">Reviewed</text>
      <text x="18" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700" fill="#1c1917">58</text>
      <text x="60" y="50" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#a8a29e">cards total</text>

      <!-- Card 2 -->
      <rect x="293" y="0" width="273" height="74" rx="12" fill="#ffffff" stroke="#e7e5e4" stroke-width="1" filter="url(#soft-shadow)" />
      <text x="311" y="22" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#047857">Known</text>
      <text x="311" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700" fill="#065f46">42</text>
      <text x="353" y="50" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#a8a29e">cards remembered</text>

      <!-- Card 3 -->
      <rect x="587" y="0" width="273" height="74" rx="12" fill="#ffffff" stroke="#e7e5e4" stroke-width="1" filter="url(#soft-shadow)" />
      <text x="605" y="22" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#b45309">To Review</text>
      <text x="605" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700" fill="#92400e">4</text>
      <text x="628" y="50" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#a8a29e">waiting for review</text>
    </g>
  </g>

  <!-- Your Decks Section -->
  <g transform="translate(70, 395)">
    <text x="0" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="-0.2" fill="#1c1917">Your Decks</text>
    <text x="0" y="32" font-family="'Inter', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#a8a29e">Jump right into any topic you're studying.</text>
    <text x="860" y="20" text-anchor="end" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#1c1917">+ Manage Decks</text>

    <!-- 2 Deck Cards Grid -->
    <g transform="translate(0, 44)">
      <!-- Deck 1: JavaScript (Amber Accent) -->
      <g transform="translate(0, 0)">
        <rect width="420" height="150" rx="14" fill="#ffffff" stroke="#e7e5e4" stroke-width="1" filter="url(#soft-shadow)" />
        <path d="M0 14 Q0 0 14 0 L14 150 Q0 150 0 136 Z" fill="#f59e0b" />

        <g transform="translate(24, 18)">
          <rect x="0" y="0" width="76" height="20" rx="5" fill="#fffbeb" />
          <text x="8" y="14" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#92400e">JavaScript</text>
          <text x="375" y="14" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#a8a29e">5 cards</text>

          <text x="0" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="-0.2" fill="#1c1917">
            JavaScript Fundamentals
          </text>
          <text x="0" y="64" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="400" fill="#78716c">
            Scope, closures, event loop, hoisting, and prototypes.
          </text>

          <line x1="0" y1="86" x2="375" y2="86" stroke="#f5f5f4" stroke-width="1" />
          <text x="0" y="108" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#a8a29e">Beginner</text>

          <rect x="305" y="92" width="70" height="26" rx="7" fill="#1c1917" />
          <path d="M322 101 L328 105 L322 109 Z" fill="#fcd34d" />
          <text x="334" y="109" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff">Study</text>
        </g>
      </g>

      <!-- Deck 2: React (Blue Accent) -->
      <g transform="translate(440, 0)">
        <rect width="420" height="150" rx="14" fill="#ffffff" stroke="#e7e5e4" stroke-width="1" filter="url(#soft-shadow)" />
        <path d="M0 14 Q0 0 14 0 L14 150 Q0 150 0 136 Z" fill="#3b82f6" />

        <g transform="translate(24, 18)">
          <rect x="0" y="0" width="50" height="20" rx="5" fill="#eff6ff" />
          <text x="8" y="14" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#1e40af">React</text>
          <text x="375" y="14" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#a8a29e">5 cards</text>

          <text x="0" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="-0.2" fill="#1c1917">
            React Fundamentals
          </text>
          <text x="0" y="64" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="400" fill="#78716c">
            Components, hooks lifecycle, state management, and props.
          </text>

          <line x1="0" y1="86" x2="375" y2="86" stroke="#f5f5f4" stroke-width="1" />
          <text x="0" y="108" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#a8a29e">Intermediate</text>

          <rect x="305" y="92" width="70" height="26" rx="7" fill="#1c1917" />
          <path d="M322 101 L328 105 L322 109 Z" fill="#fcd34d" />
          <text x="334" y="109" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff">Study</text>
        </g>
      </g>
    </g>
  </g>
</svg>
