<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <filter id="deck-card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.02" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" fill="#f8fafc" />

  <!-- Navbar -->
  <rect width="1000" height="56" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <rect x="40" y="14" width="28" height="28" rx="6" fill="#0f172a" />
  <path d="M47 28 L54 21 L61 28 L54 35 Z" fill="#34d399" />
  <text x="76" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#0f172a">CardForge</text>
  <text x="180" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#64748b">Dashboard</text>
  <text x="270" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#64748b">My Decks</text>
  <text x="360" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Explore</text>
  <line x1="360" y1="42" x2="408" y2="42" stroke="#0f172a" stroke-width="2" />
  <text x="440" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#64748b">Review Queue</text>

  <!-- Page Header -->
  <g transform="translate(60, 80)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#0f172a">Explore Technical Interview Decks</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">Curated flashcard collections designed for software engineering interviews</text>

    <!-- Filter Pills -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="46" height="28" rx="6" fill="#0f172a" />
      <text x="16" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#ffffff">All</text>

      <rect x="56" y="0" width="86" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="68" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#475569">JavaScript</text>

      <rect x="152" y="0" width="60" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="164" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#475569">React</text>

      <rect x="222" y="0" width="54" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="234" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#475569">SQL</text>

      <rect x="286" y="0" width="82" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="298" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#475569">TypeScript</text>
    </g>
  </g>

  <!-- 4 Deck Cards Grid -->
  <g transform="translate(60, 185)">
    <!-- Deck 1 -->
    <g transform="translate(0, 0)">
      <rect width="425" height="185" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#deck-card-shadow)" />
      <rect x="16" y="16" width="75" height="18" rx="4" fill="#f1f5f9" />
      <text x="24" y="29" font-family="monospace" font-size="10" font-weight="700" fill="#475569">JAVASCRIPT</text>
      <text x="350" y="29" font-family="monospace" font-size="11" fill="#64748b">5 cards</text>

      <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#0f172a">JavaScript Basics & Core</text>
      <text x="16" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">Event loop, closure scopes, hoisting, microtasks, and prototypes.</text>

      <line x1="16" y1="125" x2="409" y2="125" stroke="#f1f5f9" stroke-width="1" />
      <rect x="16" y="138" width="70" height="20" rx="4" fill="#ecfdf5" />
      <text x="24" y="152" font-family="monospace" font-size="10" font-weight="600" fill="#065f46">BEGINNER</text>
      <rect x="330" y="135" width="80" height="28" rx="6" fill="#0f172a" />
      <text x="352" y="153" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#ffffff">▶ Study</text>
    </g>

    <!-- Deck 2 -->
    <g transform="translate(455, 0)">
      <rect width="425" height="185" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#deck-card-shadow)" />
      <rect x="16" y="16" width="55" height="18" rx="4" fill="#f1f5f9" />
      <text x="24" y="29" font-family="monospace" font-size="10" font-weight="700" fill="#475569">REACT</text>
      <text x="350" y="29" font-family="monospace" font-size="11" fill="#64748b">5 cards</text>

      <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#0f172a">React Fundamentals</text>
      <text x="16" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">Virtual DOM reconciliation, hooks lifecycle, memoization & context.</text>

      <line x1="16" y1="125" x2="409" y2="125" stroke="#f1f5f9" stroke-width="1" />
      <rect x="16" y="138" width="90" height="20" rx="4" fill="#eff6ff" />
      <text x="24" y="152" font-family="monospace" font-size="10" font-weight="600" fill="#1e40af">INTERMEDIATE</text>
      <rect x="330" y="135" width="80" height="28" rx="6" fill="#0f172a" />
      <text x="352" y="153" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#ffffff">▶ Study</text>
    </g>

    <!-- Deck 3 -->
    <g transform="translate(0, 205)">
      <rect width="425" height="185" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#deck-card-shadow)" />
      <rect x="16" y="16" width="45" height="18" rx="4" fill="#f1f5f9" />
      <text x="24" y="29" font-family="monospace" font-size="10" font-weight="700" fill="#475569">SQL</text>
      <text x="350" y="29" font-family="monospace" font-size="11" fill="#64748b">4 cards</text>

      <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#0f172a">SQL Queries & Optimization</text>
      <text x="16" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">Joins, indexes, B-trees, aggregate functions, and execution plans.</text>

      <line x1="16" y1="125" x2="409" y2="125" stroke="#f1f5f9" stroke-width="1" />
      <rect x="16" y="138" width="90" height="20" rx="4" fill="#eff6ff" />
      <text x="24" y="152" font-family="monospace" font-size="10" font-weight="600" fill="#1e40af">INTERMEDIATE</text>
      <rect x="330" y="135" width="80" height="28" rx="6" fill="#0f172a" />
      <text x="352" y="153" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#ffffff">▶ Study</text>
    </g>

    <!-- Deck 4 -->
    <g transform="translate(455, 205)">
      <rect width="425" height="185" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#deck-card-shadow)" />
      <rect x="16" y="16" width="80" height="18" rx="4" fill="#f1f5f9" />
      <text x="24" y="29" font-family="monospace" font-size="10" font-weight="700" fill="#475569">TYPESCRIPT</text>
      <text x="350" y="29" font-family="monospace" font-size="11" fill="#64748b">4 cards</text>

      <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#0f172a">TypeScript Generics & Types</text>
      <text x="16" y="84" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">Conditional types, infer keyword, utility types, and branded primitives.</text>

      <line x1="16" y1="125" x2="409" y2="125" stroke="#f1f5f9" stroke-width="1" />
      <rect x="16" y="138" width="75" height="20" rx="4" fill="#fef2f2" />
      <text x="24" y="152" font-family="monospace" font-size="10" font-weight="600" fill="#991b1b">ADVANCED</text>
      <rect x="330" y="135" width="80" height="28" rx="6" fill="#0f172a" />
      <text x="352" y="153" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#ffffff">▶ Study</text>
    </g>
  </g>
</svg>
