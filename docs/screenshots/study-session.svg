<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1c1917" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1c1917" flood-opacity="0.04" />
    </filter>
    <filter id="btn-soft" x="-5%" y="-5%" width="110%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1c1917" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Warm Canvas Background -->
  <rect width="1000" height="640" fill="#FAF9F5" />

  <!-- Top Sticky Navigation Bar -->
  <rect width="1000" height="56" fill="#FAF9F5" stroke="#e7e5e4" stroke-width="1" />
  <!-- Logo -->
  <rect x="40" y="14" width="28" height="28" rx="7" fill="#1c1917" />
  <path d="M47 28 L54 21 L61 28 L54 35 Z" fill="#fcd34d" />
  <text x="78" y="33" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="-0.3" fill="#1c1917">CardForge</text>

  <!-- Nav links -->
  <text x="190" y="33" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#78716c">Dashboard</text>
  <text x="280" y="33" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1c1917">My Decks</text>
  <line x1="280" y1="42" x2="340" y2="42" stroke="#1c1917" stroke-width="2" stroke-linecap="round" />
  <text x="365" y="33" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#78716c">Explore</text>
  <text x="440" y="33" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#78716c">Review</text>
  <text x="515" y="33" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="500" fill="#78716c">Progress</text>

  <!-- User profile chip -->
  <rect x="850" y="14" width="110" height="28" rx="8" fill="#f5f5f4" stroke="#e7e5e4" stroke-width="1" />
  <circle cx="866" cy="28" r="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
  <text x="863" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#92400e">A</text>
  <text x="882" y="32" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#44403c">Alex Chen</text>

  <!-- Main Focus Study Frame -->
  <!-- Top Session Meta Line -->
  <g transform="translate(200, 78)">
    <text x="0" y="14" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#78716c">← Exit</text>
    <text x="300" y="14" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#292524">JavaScript Fundamentals</text>
    <text x="600" y="14" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#78716c">4 / 12</text>

    <!-- Progress Line Bar -->
    <rect x="0" y="24" width="600" height="4" rx="2" fill="#e7e5e4" />
    <rect x="0" y="24" width="200" height="4" rx="2" fill="#1c1917" />
  </g>

  <!-- Dominant 3D Flashcard Container -->
  <g transform="translate(200, 122)">
    <rect width="600" height="350" rx="16" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5" filter="url(#soft-shadow)" />

    <!-- Card Header Info -->
    <text x="28" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#a8a29e">QUESTION</text>
    <text x="572" y="36" text-anchor="end" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#78716c">Click to reveal</text>

    <!-- Question Title -->
    <text x="28" y="74" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="600" letter-spacing="-0.3" fill="#1c1917">
      What is a closure in JavaScript?
    </text>

    <!-- Code Snippet Box (JetBrains Mono) -->
    <g transform="translate(28, 98)">
      <rect width="544" height="136" rx="10" fill="#1c1917" />
      <circle cx="16" cy="14" r="3.5" fill="#ef4444" />
      <circle cx="27" cy="14" r="3.5" fill="#f59e0b" />
      <circle cx="38" cy="14" r="3.5" fill="#10b981" />
      <text x="525" y="16" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#78716c">javascript</text>

      <text x="20" y="44" font-family="'JetBrains Mono', monospace" font-size="12" fill="#fcd34d">function <tspan fill="#f5f5f4">makeCounter</tspan>() {</text>
      <text x="38" y="66" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a8a29e">let <tspan fill="#f5f5f4">count = 0</tspan>; <tspan fill="#78716c">// Outer lexical environment</tspan></text>
      <text x="38" y="88" font-family="'JetBrains Mono', monospace" font-size="12" fill="#fcd34d">return function<tspan fill="#f5f5f4">() {</tspan></text>
      <text x="56" y="110" font-family="'JetBrains Mono', monospace" font-size="12" fill="#fcd34d">return <tspan fill="#f5f5f4">++count;</tspan></text>
      <text x="38" y="128" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f5f5f4">};</text>
    </g>

    <!-- Hint Row -->
    <g transform="translate(28, 252)">
      <rect width="544" height="34" rx="8" fill="#fffbeb" stroke="#fef3c7" stroke-width="1" />
      <text x="14" y="21" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#92400e">
        💡 <tspan font-weight="600">Hint:</tspan> Think about how an inner function retains access to outer variables even after return.
      </text>
    </g>

    <!-- Bottom Flip Cue -->
    <line x1="28" y1="308" x2="572" y2="308" stroke="#f5f5f4" stroke-width="1" />
    <text x="300" y="332" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#78716c">
      Click card or press <tspan font-family="'JetBrains Mono', monospace" font-weight="600" fill="#292524">[Space]</tspan> to reveal answer
    </text>
  </g>

  <!-- Evaluation Card Bar: How did you do? -->
  <g transform="translate(200, 488)">
    <rect width="600" height="92" rx="14" fill="#ffffff" stroke="#e7e5e4" stroke-width="1" filter="url(#soft-shadow)" />
    <text x="300" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#57534e">How did you do?</text>

    <!-- Evaluation Buttons -->
    <g transform="translate(30, 36)">
      <!-- Still Learning Button -->
      <rect width="260" height="42" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" filter="url(#btn-soft)" />
      <text x="96" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#92400e">Still Learning</text>
      <rect x="220" y="12" width="22" height="18" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1" />
      <text x="227" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#92400e">1</text>

      <!-- I Know This Button -->
      <rect x="280" y="0" width="260" height="42" rx="10" fill="#1c1917" filter="url(#btn-soft)" />
      <text x="382" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff">I Know This</text>
      <rect x="495" y="12" width="22" height="18" rx="4" fill="#292524" />
      <text x="502" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#fcd34d">2</text>
    </g>
  </g>

  <!-- Bottom Nav & Shortcuts Info -->
  <g transform="translate(200, 600)">
    <text x="0" y="12" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#78716c">← Previous</text>
    <text x="300" y="12" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#a8a29e">
      Shortcuts: <tspan font-family="'JetBrains Mono', monospace" font-weight="500" fill="#57534e">Space</tspan> to flip · <tspan font-family="'JetBrains Mono', monospace" font-weight="500" fill="#57534e">1 &amp; 2</tspan> to rate · <tspan font-family="'JetBrains Mono', monospace" font-weight="500" fill="#57534e">← / →</tspan> to move
    </text>
    <text x="600" y="12" text-anchor="end" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#78716c">Next →</text>
  </g>
</svg>
