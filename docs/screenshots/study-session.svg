<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
    <filter id="btn-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.06" />
    </filter>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="620" fill="#f8fafc" />

  <!-- App Header Bar -->
  <rect width="1000" height="56" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <!-- Logo -->
  <rect x="32" y="14" width="28" height="28" rx="6" fill="#0f172a" />
  <path d="M39 28 L46 21 L53 28 L46 35 Z" fill="#34d399" />
  <text x="68" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a">CardForge</text>

  <!-- Nav links -->
  <text x="180" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Dashboard</text>
  <line x1="180" y1="42" x2="245" y2="42" stroke="#0f172a" stroke-width="2" />
  <text x="270" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">My Decks</text>
  <text x="360" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">Explore</text>
  <text x="440" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">Review Queue</text>

  <!-- User profile chip -->
  <rect x="850" y="14" width="118" height="28" rx="14" fill="#f1f5f9" />
  <circle cx="864" cy="28" r="9" fill="#0f172a" />
  <text x="861" y="31" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">A</text>
  <text x="880" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#334155">alex.dev</text>

  <!-- Main Container -->
  <!-- Top Session Meta Bar -->
  <g transform="translate(180, 80)">
    <rect x="0" y="0" width="640" height="42" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0f172a">JavaScript Deep Dive</text>
    <rect x="150" y="12" width="70" height="18" rx="4" fill="#f1f5f9" />
    <text x="160" y="25" font-family="monospace" font-size="10" font-weight="600" fill="#475569">INTERMEDIATE</text>

    <!-- Progress indicator -->
    <text x="490" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#64748b">Card 7 of 10</text>
    <rect x="575" y="18" width="50" height="6" rx="3" fill="#e2e8f0" />
    <rect x="575" y="18" width="35" height="6" rx="3" fill="#10b981" />
  </g>

  <!-- Interactive 3D Flashcard -->
  <g transform="translate(180, 140)">
    <rect width="640" height="360" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)" />

    <!-- Card Header Tag -->
    <rect x="24" y="20" width="80" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="32" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#065f46">QUESTION</text>

    <!-- Flip Hint Badge -->
    <rect x="520" y="20" width="96" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="528" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#64748b">Click to Flip ⟳</text>

    <!-- Card Question Text -->
    <text x="24" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0f172a">
      How do JavaScript Closures preserve scope, and what is a memory leak risk?
    </text>

    <!-- Code Snippet Box -->
    <g transform="translate(24, 100)">
      <rect width="592" height="150" rx="8" fill="#0f172a" />
      <!-- Code window dots -->
      <circle cx="16" cy="14" r="4" fill="#ef4444" />
      <circle cx="28" cy="14" r="4" fill="#f59e0b" />
      <circle cx="40" cy="14" r="4" fill="#10b981" />
      <text x="530" y="17" font-family="monospace" font-size="10" fill="#64748b">javascript</text>

      <!-- Code lines -->
      <text x="20" y="44" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#38bdf8">function <tspan fill="#f1f5f9">createCounter</tspan>() {</text>
      <text x="40" y="68" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#94a3b8">let <tspan fill="#f1f5f9">count = 0</tspan>; <tspan fill="#64748b">// Retained in closure scope</tspan></text>
      <text x="40" y="92" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#38bdf8">return function<tspan fill="#f1f5f9">() {</tspan></text>
      <text x="60" y="116" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#38bdf8">return <tspan fill="#f1f5f9">++count;</tspan></text>
      <text x="40" y="136" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" fill="#f1f5f9">};</text>
    </g>

    <!-- Hint dropdown toggle -->
    <g transform="translate(24, 265)">
      <rect width="592" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#475569">💡 Hint: Think about references in the heap that cannot be garbage collected</text>
    </g>

    <!-- Bottom flip indicator -->
    <text x="320" y="335" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
      Press <tspan font-family="monospace" font-weight="700" fill="#0f172a">[Space]</tspan> or click anywhere to flip to explanation
    </text>
  </g>

  <!-- Recall Evaluation Controls -->
  <g transform="translate(180, 520)">
    <!-- Learning / Review Again Button -->
    <g transform="translate(40, 0)">
      <rect width="250" height="48" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#btn-shadow)" />
      <text x="80" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#b45309">Review Again</text>
      <rect x="200" y="14" width="28" height="20" rx="4" fill="#fef3c7" />
      <text x="210" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#b45309">[1]</text>
    </g>

    <!-- Mastered / Know This Button -->
    <g transform="translate(350, 0)">
      <rect width="250" height="48" rx="8" fill="#0f172a" filter="url(#btn-shadow)" />
      <text x="75" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff">I Know This</text>
      <rect x="195" y="14" width="28" height="20" rx="4" fill="#334155" />
      <text x="205" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">[2]</text>
    </g>
  </g>

  <!-- Keyboard hints footer -->
  <text x="500" y="595" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b">
    Keyboard Shortcuts: <tspan font-weight="600" fill="#0f172a">[Space]</tspan> Flip · <tspan font-weight="600" fill="#0f172a">[←]</tspan> Previous · <tspan font-weight="600" fill="#0f172a">[→]</tspan> Next · <tspan font-weight="600" fill="#0f172a">[H]</tspan> Hint
  </text>
</svg>
